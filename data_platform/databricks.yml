# Data platform bundle: ingestion and bronze → silver → gold for the zone-production use case.
#
# Principles (apply to every resource added here):
#   - Nothing environment-specific in code: catalogs and emails are variables, identities are set per target.
#   - dev = one isolated copy per developer (development mode); prod = one copy, deployed by CI, run as a
#     service principal.
#   - Logic lives in importable modules under src/ with unit tests in tests/. Entry points can be notebooks
#     or Python files; both run on serverless (no cluster blocks).
#   - Environments are pinned: notebooks in their own environment (saved in the notebook source),
#     Python file tasks in a job-level environment, on the latest serverless environment version.
#   - Batch jobs use performance_target: STANDARD unless a deadline needs PERFORMANCE_OPTIMIZED.
#   - Demo-only resources (data simulators) are defined under targets.dev, so they can't reach prod.
#   - Resource files are named <name>.<type>.yml (e.g. simulate_live.job.yml).
#
# Commands (from this folder):
#   databricks bundle validate --strict -t dev
#   databricks bundle deploy -t dev
#   databricks bundle validate --strict -t prod   # clean only when run as the service principal (CI)
bundle:
  name: data_platform

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog this deployment reads from and writes to.
  notification_email:
    description: Who gets failure emails.
    default: ${workspace.current_user.userName}

# Files that are not needed in the workspace (local tooling and tests).
sync:
  exclude:
    - tests/**
    - pyproject.toml
    - requirements-dev.txt
    - AGENTS.md
    - CLAUDE.md

targets:
  # Per-developer deployment: resources get a "[dev <user>]" prefix, schedules are paused,
  # and everything runs as the developer.
  dev:
    mode: development
    default: true
    workspace:
      profile: energy-demo           # CLI profile name, not a URL: keep hosts out of the repo
    variables:
      catalog: dev
    # Demo-only resources: defined here, not in resources/, so a prod deployment never contains them.
    resources:
      jobs:
        simulate_meteologica:
          name: simulate_meteologica
          description: "Demo only: lands simulated Meteologica forecast files in ${var.catalog}.raw.api_landing"
          max_concurrent_runs: 1
          performance_target: STANDARD          # batch with no deadline: cheaper, slower start
          parameters:
            - name: catalog
              default: ${var.catalog}
          # Pinned serverless environment (overrides the notebook's own environment).
          environments:
            - environment_key: default
              spec:
                environment_version: "6"       # latest serverless environment version
          tasks:
            - task_key: land_meteologica
              environment_key: default
              notebook_task:
                notebook_path: ./src/notebooks/land_meteologica.py   # paths in databricks.yml are relative to it
                base_parameters:
                  start_date: "2026-10-20"
                  end_date: "2026-11-09"
          tags:
            layer: raw
            purpose: demo-simulation

  # Production: one copy, deployed by CI as the service principal, which jobs also run as.
  prod:
    mode: production
    workspace:
      profile: energy-demo           # single-workspace setup for now; a prod workspace later only changes this
      # Production mode requires an explicit root_path. The deploying identity's home folder is
      # restricted (the service principal's, once CI deploys). Not /Workspace/Shared, which gives
      # every workspace user write access to production code.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # Application ID of the production service principal (an identifier, not a secret).
    run_as:
      service_principal_name: d27ece6e-50ff-4ba1-84ff-ed4d887d467a
    variables:
      catalog: prod
    permissions:
      - level: CAN_MANAGE
        service_principal_name: d27ece6e-50ff-4ba1-84ff-ed4d887d467a
      - level: CAN_VIEW
        group_name: users
