# Hourly ingestion: fetch from the API → land raw JSON in the volume → Auto Loader into bronze.
# Add a source: register it in src/ingestion/sources.py, then add a fetch/bronze task pair below.
resources:
  jobs:
    ingest_hourly:
      name: ingest_hourly
      description: Hourly API ingestion into ${var.catalog}.raw.api_landing and ${var.catalog}.bronze
      max_concurrent_runs: 1            # never let two runs pull and land at the same time
      timeout_seconds: 1800
      schedule:
        quartz_cron_expression: "0 5 * * * ?"   # every hour at :05
        timezone_id: UTC
        # No pause_status here: development mode then pauses it, production leaves it active.
        # (An explicit UNPAUSED would override development mode.)
      email_notifications:
        on_failure:
          - ${var.notification_email}
      parameters:
        - name: catalog
          default: ${var.catalog}
      tasks:
        - task_key: fetch_open_meteo_weather
          notebook_task:
            notebook_path: ../src/ingestion/fetch_api.py
            base_parameters:
              source: open_meteo
              dataset: weather_forecast
          max_retries: 2                # API calls fail transiently; retry before alerting
          min_retry_interval_millis: 60000

        - task_key: bronze_open_meteo_weather
          depends_on:
            - task_key: fetch_open_meteo_weather
          notebook_task:
            notebook_path: ../src/bronze/autoloader_bronze.py
            base_parameters:
              source: open_meteo
              dataset: weather_forecast
          max_retries: 1
      tags:
        layer: bronze
        cadence: hourly
