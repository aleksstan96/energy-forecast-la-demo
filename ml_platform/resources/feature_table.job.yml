# 1. Feature pipeline: builds the feature table the model trains and scores on.
resources:
  jobs:
    feature_table:
      name: feature_table
      max_concurrent_runs: 1
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: "0 30 7 * * ?"    # daily 07:30, after the data pipeline
        timezone_id: Europe/Rome
      email_notifications:
        on_failure: [ "${var.notification_email}" ]
      parameters:                                  # job parameters reach every notebook task as widgets
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      environments:
        - environment_key: ml
          spec: ${var.ml_environment}
      tasks:
        - task_key: build_feature_table
          environment_key: ml
          notebook_task:
            notebook_path: ../src/01_feature_table.py
